<div id="root"></div>
<script type="text/babel">

  serif:       "'Playfair Display', Georgia, serif",

const HelpContext = React.createContext(() => {});

// ─── Photo helpers ──────────────────────────────────────────────────────────
const PHOTOS = {
  hero:          '1616594039964-ae9021a400a0',
  modernWarm:    '1493663284031-b7e3aefcae8e',
  calm:          '1616486338812-3dadae4b4ace',
  bold:          '1532323544230-7191fd51bc1b',
  earthy:        '1586023492125-27b2c045efd7',
  studio:        '1583845112203-29329902332e',

  textureSoft:   '1611117775350-ac3950990985',

  minimal:       '1502005229762-cf1b2da7c5d6',
  eclectic:      '1564540583246-934409427776',
  natural:       '1505873242700-f289a29e1e0f',
  modern:        '1565538810643-b5bdb714032a',
  vintage:       '1560448204-e02f11c3d0e2',
  enveloping:    '1522708323590-d24dbb6b0267',
  tableRunner:   '1604147706283-d7119b5b822c',
  blackFrame:    '1513519245088-0e12902e5a38',
  candles:       '1603006905003-be475563bc59',
  placemats:     '1556910103-1c02745aae4d',
  print:         '1513519245088-0e12902e5a38',
  light:         '1513506003901-1e6a229e2d15',
  accessory:     '1565193566173-7a0ee3dbe261',
  arRoom:        '1616594039964-ae9021a400a0',
};

function photoUrl(key, w = 800, h = 600) {
  const id = PHOTOS[key];
  if (!id) return null;
  return `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=${w}&h=${h}&q=70`;
}

// ─── Scaled screen wrapper ──────────────────────────────────────────────────
function Screen({ w, h, children }) {
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const update = () => setScale(Math.min(window.innerWidth / w, window.innerHeight / h));
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, [w, h]);
  return (
    <div style={{ width: '100vw', height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', background: '#1C1C1A' }}>
      <div style={{ width: w, height: h, transform: `scale(${scale})`, transformOrigin: 'center center', flexShrink: 0 }}>
        {children}
      </div>
    </div>
  );
}

// ─── Shared components ──────────────────────────────────────────────────────
function NavBar({ step, onExit }) {
  const openHelp = React.useContext(HelpContext);
  return (
    <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 68, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 56px', borderBottom: `0.5px solid ${TK.border}`, background: TK.bg, zIndex: 10 }}>
      <div style={{ fontFamily: TK.serif, fontSize: 17, fontWeight: 300, color: TK.ink, letterSpacing: '0.04em' }}>
        house<span style={{ color: TK.accent }}>2</span>home
      </div>
      {step && <div style={{ fontFamily: TK.sans, fontSize: 11, color: TK.inkLight, letterSpacing: '0.1em', textTransform: 'uppercase' }}>{step}</div>}
      <div style={{ display: 'flex', alignItems: 'center', gap: 24 }}>
        <div onClick={openHelp} style={{ fontFamily: TK.sans, fontSize: 11, letterSpacing: '0.08em', textTransform: 'uppercase', color: TK.inkLight, cursor: 'pointer' }}>How it works</div>
        <div onClick={onExit} style={{ fontFamily: TK.sans, fontSize: 11, letterSpacing: '0.08em', textTransform: 'uppercase', color: TK.inkLight, cursor: 'pointer' }}>Save & exit</div>
      </div>
    </div>
  );
}

function ProgressBar({ current, total }) {
  return (
    <div style={{ position: 'absolute', top: 68, left: 0, right: 0, height: 2, background: TK.border }}>
      <div style={{ width: `${(current / total) * 100}%`, height: '100%', background: TK.accent, transition: 'width 0.4s' }} />
    </div>
  );
}

function RoomPhoto({ width, height, photo, label, style: sx = {} }) {
  const url = photoUrl(photo, typeof width === 'number' ? width * 2 : 1600, typeof height === 'number' ? height * 2 : 1200);
  const bg = url
    ? `linear-gradient(160deg,rgba(122,154,122,0.06),rgba(28,28,26,0.18)),url("${url}") center/cover no-repeat`
    : 'linear-gradient(160deg,#E4EDE0,#CDD8C8)';
  return (
    <div style={{ width, height, background: bg, backgroundColor: '#E4EDE0', position: 'relative', overflow: 'hidden', flexShrink: 0, ...sx }}>
      {label && <div style={{ position: 'absolute', bottom: 10, left: 10, fontFamily: TK.sans, fontSize: 11, color: '#fff', letterSpacing: '0.1em', textTransform: 'uppercase', padding: '5px 10px', background: 'rgba(28,28,26,0.55)', backdropFilter: 'blur(6px)' }}>{label}</div>}
    </div>
  );
}

function Thumb({ size = 40, photo, style: sx = {} }) {
  const url = photo ? photoUrl(photo, 200, 200) : null;
  return <div style={{ width: size, height: size, background: url ? `url("${url}") center/cover` : TK.accentBg, backgroundColor: TK.accentBg, flexShrink: 0, ...sx }} />;
}

function Btn({ label, variant = 'primary', size = 'md', onClick, style: sx = {} }) {
  const pad = size === 'lg' ? '14px 30px' : size === 'sm' ? '8px 16px' : '11px 24px';
  const fs = size === 'lg' ? 14 : size === 'sm' ? 12 : 13;
  const varStyle = variant === 'primary'  ? { background: TK.accent, color: '#fff', border: 'none' } :
                   variant === 'dark'     ? { background: TK.ink, color: '#fff', border: 'none' } :
                   variant === 'outline'  ? { background: 'transparent', color: TK.ink, border: `0.5px solid ${TK.border}` } :
                                            { background: 'transparent', color: TK.inkLight, border: 'none' };
  return (
    <div onClick={onClick} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontFamily: TK.sans, fontWeight: 500, letterSpacing: '0.05em', cursor: 'pointer', padding: pad, fontSize: fs, ...varStyle, ...sx }}>
      {label}
    </div>
  );
}

// ─── Pack data ──────────────────────────────────────────────────────────────
const PACKS = {
  A: { name: 'The Calm Edit',   desc: 'Soft neutrals, warm light, quiet elegance', tag: 'minimal · neutral · airy',      photo: 'calm',   total: '$79',
       items: [{ cat: 'Print', name: 'Abstract Minimal No. 3', price: '$24' }, { cat: 'Light', name: 'Woven Pendant Shade', price: '$38' }, { cat: 'Accessory', name: 'Ceramic Bud Vase', price: '$17' }] },

  C: { name: 'The Earthy Mix',  desc: 'Plants, raw materials, grounded warmth',    tag: 'natural · organic · grounded',  photo: 'earthy', total: '$78',
       items: [{ cat: 'Print', name: 'Botanical Study I', price: '$22' }, { cat: 'Light', name: 'Terracotta Table Lamp', price: '$38' }, { cat: 'Accessory', name: 'Rattan Tray', price: '$18' }] },
  D: { name: 'The Soft Studio', desc: 'Linen, cream, gentle structure',            tag: 'soft · refined · structured',   photo: 'studio', total: '$85',
       items: [{ cat: 'Print', name: 'Line Art Figure Study', price: '$24' }, { cat: 'Light', name: 'Slim Column Table Lamp', price: '$44' }, { cat: 'Accessory', name: 'Boucle Throw Pillow', price: '$17' }] },
};

// ─── Placeholder page ────────────────────────────────────────────────────────
function PlaceholderPage({ title, goBack }) {

    <Screen w={1280} h={800}>

        <div style={{ position: 'absolute', top: 68, left: 0, width: 1280, height: 732, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 20 }}>
          <div style={{ fontFamily: TK.sans, fontSize: 11, color: TK.accent, letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 500 }}>{title}</div>

          <p style={{ fontFamily: TK.sans, fontSize: 15, color: TK.inkMid, fontWeight: 300, maxWidth: 400, textAlign: 'center', lineHeight: 1.7 }}>This page is coming soon. Check back after the sprint.</p>

// ─── Screen: Landing ────────────────────────────────────────────────────────

          <div style={{ fontFamily: TK.serif, fontSize: 18, fontWeight: 300, color: TK.ink, letterSpacing: '0.04em' }}>house<span style={{ color: TK.accent }}>2</span>home</div>

        </div>
        <div style={{ position: 'absolute', top: 68, left: 64, width: 540, height: 752, display: 'flex', flexDirection: 'column', justifyContent: 'center', paddingRight: 32 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 30 }}>

          <h1 style={{ fontFamily: TK.serif, fontWeight: 300, fontSize: 80, lineHeight: 1.02, color: TK.ink, letterSpacing: '-0.01em', marginBottom: 30 }}>Find your<br /><span style={{ fontStyle: 'italic' }}>style.</span></h1>

        <div style={{ position: 'absolute', top: 88, right: 64, width: 620, height: 672 }}>

// ─── Quiz shell ─────────────────────────────────────────────────────────────
function QuizShell({ step, total, question, sub, children, goBack, goNext, nextLabel = 'Next →', hint, onExit }) {
  return (
    <Screen w={1280} h={800}>
      <div style={{ width: 1280, height: 800, background: TK.bg, fontFamily: TK.sans, position: 'relative', overflow: 'hidden' }}>
        <NavBar step={`Question ${step} of ${total}`} onExit={onExit} />
        <ProgressBar current={step} total={total} />
        <div style={{ position: 'absolute', top: 70, left: 0, width: 1280, height: 730, display: 'flex', flexDirection: 'column', padding: '36px 64px 28px' }}>
          <h2 style={{ fontFamily: TK.serif, fontWeight: 300, fontSize: 38, color: TK.ink, lineHeight: 1.1, marginBottom: 6 }}>{question}</h2>
          {sub && <p style={{ fontFamily: TK.sans, fontSize: 13, color: TK.inkLight, marginBottom: 28, marginTop: 6 }}>{sub}</p>}
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}>{children}</div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingTop: 18 }}>
            <div onClick={goBack} style={{ fontFamily: TK.sans, fontSize: 12, color: TK.inkLight, letterSpacing: '0.07em', textTransform: 'uppercase', cursor: 'pointer' }}>← Back</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
              {hint && <div style={{ fontFamily: TK.sans, fontSize: 13, color: TK.inkMid }}>{hint}</div>}
              <Btn label={nextLabel} onClick={goNext} />
            </div>
          </div>
        </div>
      </div>
    </Screen>
  );
}

// ─── Quiz Q1 ────────────────────────────────────────────────────────────────
function QuizQ1({ sel, toggle, goBack, goNext, onExit }) {
  const opts = [
    { label: 'Warm & cozy',        sub: 'textures, earth tones',   photo: 'cozy' },
    { label: 'Clean & minimal',    sub: 'whites, light wood',       photo: 'minimal' },
    { label: 'Bold & eclectic',    sub: 'color, pattern, contrast', photo: 'eclectic' },
    { label: 'Natural & organic',  sub: 'plants, raw materials',    photo: 'natural' },
    { label: 'Modern & sleek',     sub: 'metal, glass, geometry',   photo: 'modern' },
    { label: 'Vintage & lived-in', sub: 'antiques, patina',         photo: 'vintage' },
  ];
  const hint = sel.size === 0 ? '' : `${sel.size} selected`;
  return (
    <QuizShell step={1} total={6} question="When you walk into a room you love, it usually feels…" sub="Pick as many as feel right" goBack={goBack} goNext={goNext} hint={hint} onExit={onExit}>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 12, flex: 1 }}>
        {opts.map((o) => {
          const on = sel.has(o.label);
          return (
            <div key={o.label} onClick={() => toggle(o.label)} style={{ background: TK.paper, overflow: 'hidden', cursor: 'pointer', border: on ? `1.5px solid ${TK.accent}` : `0.5px solid ${TK.border}`, boxShadow: on ? '0 4px 16px rgba(122,154,122,0.14)' : 'none', display: 'flex', flexDirection: 'column' }}>
              <div style={{ height: 96, position: 'relative', flexShrink: 0 }}>
                <RoomPhoto width="100%" height={96} photo={o.photo} label={null} />
                <div style={{ position: 'absolute', top: 8, right: 8, width: 18, height: 18, background: on ? TK.accent : 'rgba(255,255,255,0.85)', border: on ? 'none' : '1.5px solid rgba(255,255,255,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      {on && <span style={{ color: '#fff', fontSize: 11 }}>✓</span>}
    </div>
              </div>
              <div style={{ padding: '12px 16px' }}>
                <div style={{ fontFamily: TK.sans, fontSize: 14, fontWeight: 500, color: TK.ink }}>{o.label}</div>
                <div style={{ fontFamily: TK.sans, fontSize: 12, color: TK.inkMid, marginTop: 3 }}>{o.sub}</div>
              </div>
            </div>
          );
        })}
      </div>
    </QuizShell>
  );
}

// ─── Quiz Q2 ────────────────────────────────────────────────────────────────
function QuizQ2({ sel, setSel, goBack, goNext, onExit }) {
  const palettes = [
    { label: 'Warm & earthy',  colors: ['#C4A882','#8B6E4E','#E8DDD0','#5C4030'] },

              <div style={{ display: 'flex', height: 100, flexShrink: 0 }}>{p.colors.map((c, i) => <div key={i} style={{ flex: 1, background: c }} />)}</div>

              </div>

      </div>

}

// ─── Quiz Q3 ────────────────────────────────────────────────────────────────

  const opts = [
    { label: 'Natural & raw',  desc: 'Wood grain, stone, linen, rattan — materials that feel alive', subs: ['Wooden shelves', 'Stone vessels', 'Linen throws'], photo: 'textureRaw' },
    { label: 'Soft & layered', desc: 'Velvet, boucle, wool, silk — warmth you can feel',             subs: ['Boucle cushions', 'Knit blankets', 'Velvet accents'], photo: 'textureSoft' },
    { label: 'Clean & smooth', desc: 'Glass, ceramic, lacquered wood — quiet, considered surfaces',  subs: ['Ceramic vessels', 'Glass objects', 'Lacquered trays'], photo: 'textureSmooth' },
  ];
  const hint = sel.size === 0 ? '' : `${sel.size} selected`;
  return (
    <QuizShell step={3} total={6} question="What textures draw you in most?" sub="Pick as many as feel right" goBack={goBack} goNext={goNext} hint={hint} onExit={onExit}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12, flex: 1 }}>
        {opts.map((o) => {
          const on = sel.has(o.label);
          return (
            <div key={o.label} onClick={() => toggle(o.label)} style={{ background: TK.paper, cursor: 'pointer', flex: 1, border: on ? `1.5px solid ${TK.accent}` : `0.5px solid ${TK.border}`, display: 'flex', alignItems: 'center', overflow: 'hidden' }}>
              <RoomPhoto width={160} height="100%" photo={o.photo} label={null} style={{ alignSelf: 'stretch' }} />
              <div style={{ padding: '16px 24px', flex: 1 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 4 }}>
                  <div style={{ fontFamily: TK.sans, fontSize: 15, fontWeight: 500, color: TK.ink }}>{o.label}</div>
                  <div style={{ width: 18, height: 18, background: on ? TK.accent : 'transparent', border: on ? 'none' : `1.5px solid ${TK.border}`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                    {on && <span style={{ color: '#fff', fontSize: 11 }}>✓</span>}
                  </div>
                </div>
                <div style={{ fontFamily: TK.sans, fontSize: 13, color: TK.inkMid, marginBottom: 8 }}>{o.desc}</div>
                <div style={{ display: 'flex', gap: 8 }}>
                  {o.subs.map(s => <div key={s} style={{ fontFamily: TK.sans, fontSize: 11, color: TK.inkLight, padding: '3px 10px', border: `0.5px solid ${TK.border}` }}>{s}</div>)}

  const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const deliveryRange = `${fmt(d1)}–${fmt(d2)}`;
  const items = [
    { cat: 'Print',     name: 'Line Art Figure Study',  price: 24, photo: 'print' },
    { cat: 'Light',     name: 'Slim Column Table Lamp', price: 44, photo: 'light' },
    { cat: 'Accessory', name: 'Boucle Throw Pillow',    price: 17, photo: 'accessory' },
  ];
  const total = items.reduce((s, i) => s + i.price, 0) + 6.50;
  return (
    <Screen w={1280} h={800}>
      <div style={{ width: 1280, height: 800, background: TK.bg, fontFamily: TK.sans, position: 'relative', overflow: 'hidden' }}>
        <NavBar onExit={onExit} />
        <div style={{ position: 'absolute', top: 68, left: 0, width: 1280, height: 732, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '0 64px' }}>
          <div style={{ textAlign: 'center', marginBottom: 36 }}>
            <div style={{ width: 48, height: 48, borderRadius: '50%', background: TK.accentBg, border: `1.5px solid ${TK.accent}`, display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 20px' }}>
              <span style={{ color: TK.accent, fontSize: 20 }}>✓</span>
            </div>
            <div style={{ fontFamily: TK.sans, fontSize: 11, color: TK.accent, letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 10 }}>Order confirmed</div>
            <h1 style={{ fontFamily: TK.serif, fontWeight: 300, fontSize: 50, color: TK.ink, marginBottom: 8, lineHeight: 1.05 }}>You're all set.</h1>
            <p style={{ fontFamily: TK.sans, fontSize: 15, color: TK.inkMid, fontWeight: 300, maxWidth: 480, margin: '0 auto', lineHeight: 1.65 }}>The Soft Studio is on its way. You made great choices — trust your taste.</p>
          </div>
          <div style={{ background: TK.paper, border: `0.5px solid ${TK.border}`, width: '100%', maxWidth: 780, display: 'flex', overflow: 'hidden' }}>
            <RoomPhoto width={220} height={220} photo="studio" label="The Soft Studio" />
            <div style={{ flex: 1, padding: '24px 28px', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
              <div style={{ fontFamily: TK.serif, fontSize: 22, fontWeight: 400, color: TK.ink, marginBottom: 4 }}>The Soft Studio</div>
              <div style={{ display: 'flex', gap: 20, marginBottom: 14 }}>
                <div style={{ fontFamily: TK.sans, fontSize: 12, color: TK.inkMid }}>Order #H2H-00482</div>
                <div style={{ fontFamily: TK.sans, fontSize: 12, color: TK.inkMid }}>Est. delivery {deliveryRange}</div>
              </div>
              <div style={{ display: 'flex', gap: 16 }}>
                {items.map(item => (
                  <div key={item.cat} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <Thumb size={32} photo={item.photo} />
                    <div>
                      <div style={{ fontFamily: TK.sans, fontSize: 11, color: TK.inkLight }}>{item.cat}</div>
                      <div style={{ fontFamily: TK.sans, fontSize: 12, color: TK.ink }}>{item.name}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div style={{ width: 160, padding: '24px 20px', borderLeft: `0.5px solid ${TK.border}`, display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', textAlign: 'center' }}>
              <div style={{ fontFamily: TK.serif, fontSize: 30, fontWeight: 300, color: TK.ink, marginBottom: 4 }}>${total}</div>
              <div style={{ fontFamily: TK.sans, fontSize: 11, color: TK.inkLight, marginBottom: 16 }}>incl. tax</div>
              <div style={{ fontFamily: TK.sans, fontSize: 11, color: TK.inkMid, lineHeight: 1.5 }}>A confirmation<br />email is on its way.</div>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 16, marginTop: 24 }}>
            <Btn label="Track my order" variant="outline" />
            <Btn label="Style tips for your pack →" variant="primary" />
          </div>
        </div>
      </div>
    </Screen>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [history, setHistory] = React.useState([0]);
  const [showHelp, setShowHelp] = React.useState(false);
  const screen = history[history.length - 1];

  const go = (n) => setHistory(h => [...h, n]);
  const back = () => setHistory(h => h.length > 1 ? h.slice(0, -1) : h);

  const [q1, setQ1] = React.useState(() => new Set());
  const [q2, setQ2] = React.useState(null);
  const [q3, setQ3] = React.useState(() => new Set());
  const [q4, setQ4] = React.useState(null);
  const [q5, setQ5] = React.useState(() => new Set());
  const [q6, setQ6] = React.useState(null);

  // Pack tournament state
  const [packR1, setPackR1] = React.useState('A');
  const [packR2, setPackR2] = React.useState('A');

  function toggle(setter) {
    return (val) => setter(prev => {
      const next = new Set(prev);
      next.has(val) ? next.delete(val) : next.add(val);
      return next;
    });
  }

  // Screens: 0=Landing, 1=Q1, 2=Q2, 3=Q3, 4=Q4, 5=Q5, 6=Q6,
  //          7=StyleResult, 8=PackR1, 9=PackR2, 10=PackR3,
  //          11=PackReveal, 12=AR, 13=Cart, 14=Checkout, 15=OrderConfirm,
  //          16=About(placeholder), 17=BrowseAllPacks

  const onExit = () => go(0);

  function renderScreen() {
    if (screen === 0) return <Landing go={() => go(1)} goQuiz={() => go(1)} goHowItWorks={() => setShowHelp(true)} goAbout={() => go(16)} />;
    if (screen === 16) return <PlaceholderPage title="About" goBack={() => go(0)} />;

    if (screen === 1) return <QuizQ1 sel={q1} toggle={toggle(setQ1)} goBack={back} goNext={() => go(2)} onExit={onExit} />;
    if (screen === 2) return <QuizQ2 sel={q2} setSel={setQ2} goBack={back} goNext={() => go(3)} onExit={onExit} />;
    if (screen === 3) return <QuizQ3 sel={q3} toggle={toggle(setQ3)} goBack={back} goNext={() => go(4)} onExit={onExit} />;
    if (screen === 4) return <QuizQ4 sel={q4} setSel={setQ4} goBack={back} goNext={() => go(5)} onExit={onExit} />;
    if (screen === 5) return <QuizQ5 sel={q5} toggle={toggle(setQ5)} goBack={back} goNext={() => go(6)} onExit={onExit} />;
    if (screen === 6) return <QuizQ6 sel={q6} setSel={setQ6} goBack={back} goNext={() => go(7)} onExit={onExit} />;

    if (screen === 7) return <StyleResult go={() => go(8)} goBack={() => go(1)} onExit={onExit} />;

    if (screen === 8) return (
      <PackRound round={1} leftKey="A" rightKey="B"
        onChoose={(k) => { setPackR1(k); go(9); }}
        goBack={() => go(7)} goBrowse={() => go(17)} onExit={onExit} />
    );
    if (screen === 9) return (
      <PackRound round={2} leftKey={packR1} rightKey="C"
        onChoose={(k) => { setPackR2(k); go(10); }}
        goBack={back} onExit={onExit} />
    );
    if (screen === 10) return (
      <PackRound round={3} leftKey={packR2} rightKey="D"
        onChoose={() => go(11)}
        goBack={back} onExit={onExit} />
    );

    if (screen === 17) return <BrowseAllPacks goReveal={() => go(11)} goBack={back} onExit={onExit} />;

    if (screen === 11) return <PackReveal goCart={() => go(13)} goAR={() => go(12)} goBack={() => go(8)} onExit={onExit} />;
    if (screen === 12) return <ARScreen goCart={() => go(13)} goBack={back} onExit={onExit} />;
    if (screen === 13) return <CartPage goNext={() => go(14)} goBack={back} onExit={onExit} />;
    if (screen === 14) return <CheckoutPage goNext={() => go(15)} goBack={back} onExit={onExit} />;
    if (screen === 15) return <OrderConfirm onExit={onExit} />;

    return null;
  }

  return (
    <HelpContext.Provider value={() => setShowHelp(true)}>
      {renderScreen()}
      {showHelp && <HowItWorksModal onClose={() => setShowHelp(false)} />}
    </HelpContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
